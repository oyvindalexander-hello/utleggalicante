  --line:#CFD6CB; --warn:#8A3324; --focus:#1F6B58; --plus:#1F6B58; --minus:#8A3324;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111614; --raise:#19201C; --sunk:#0C110F; --ink:#E9EEE8; --soft:#97A69D;
    --line:#2B3530; --warn:#E0806C; --focus:#63C4A8; --plus:#63C4A8; --minus:#E0806C;
    --p0:#63C4A8; --p1:#D58FB2; --p2:#E8A06C; --p3:#7FB0E0; --p4:#D9C063;
    --w0:#1C332C; --w1:#33222B; --w2:#3A2A1E; --w3:#1C2A3A; --w4:#33301A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:540px;margin:0 auto;padding:22px 18px 72px}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* personfarger: c0–c4 */
.c0{--pc:var(--p0);--pw:var(--w0)} .c1{--pc:var(--p1);--pw:var(--w1)} .c2{--pc:var(--p2);--pw:var(--w2)}
.c3{--pc:var(--p3);--pw:var(--w3)} .c4{--pc:var(--p4);--pw:var(--w4)}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.mark{font-family:'Fraunces',Georgia,serif;font-size:1.05rem;letter-spacing:.01em}
.linkbtn{background:none;border:0;padding:4px;color:var(--soft);font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

.banner{height:170px;border-radius:14px;margin-bottom:24px;
  background:#0d1512 var(--photo) center 32%/cover no-repeat}

.hero{margin-bottom:30px}
.period{font-size:.85rem;color:var(--soft);margin-bottom:10px}
.verdict{
  font-family:'Fraunces',Georgia,serif;font-size:clamp(1.9rem,8.5vw,2.6rem);line-height:1.12;
  letter-spacing:-.015em;font-weight:600;margin:0 0 18px;font-variant-numeric:tabular-nums;
}
.verdict.many{font-size:clamp(1.5rem,6.5vw,1.9rem);margin-bottom:10px}
.verdict .sum{white-space:nowrap}
ul.pay{list-style:none;margin:0 0 18px;padding:0}
ul.pay li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:1rem}
ul.pay li .who2{min-width:0}
ul.pay li .who2 b{font-weight:600;color:var(--pc)}
ul.pay li .v{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.15rem;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.split{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-bottom:10px}
.split i{display:block;height:100%;background:var(--pc)}
.legend{display:grid;grid-template-columns:1fr auto auto;column-gap:14px;row-gap:3px;font-size:.88rem;align-items:baseline}
.legend .who{
  color:var(--soft);background:none;border:0;padding:0;text-align:left;font:inherit;font-size:.88rem;
  display:flex;align-items:center;gap:7px;min-width:0;
}
.legend .who span{border-bottom:1px dotted var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .who:hover span{color:var(--ink);border-bottom-color:var(--ink)}
.legend .amt{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.legend .bal{font-variant-numeric:tabular-nums;font-size:.8rem;text-align:right;min-width:68px}
.legend .bal.plus{color:var(--plus)}
.legend .bal.minus{color:var(--minus)}
.legend .bal.zero{color:var(--soft)}
.legend .head{font-size:.75rem;color:var(--soft)}
.totline{font-size:.82rem;color:var(--soft);margin-top:10px}

.card{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:16px}
.form-row{display:flex;gap:10px;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
label.f span.l{font-size:.8rem;color:var(--soft)}
input[type=text],input[type=date],input[type=password]{
  width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 12px;
}
input.big{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;font-variant-numeric:tabular-nums}
.payer{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.payer button{
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 6px;
  font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.payer button[aria-pressed=true]{background:var(--pw);border-color:var(--pc);color:var(--pc);font-weight:600}
.shares button{position:relative;padding-left:22px}
.shares button::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;
  border-radius:3px;border:1.5px solid var(--line)}
.shares button[aria-pressed=true]::before{background:var(--pc);border-color:var(--pc)}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lbl .linkbtn{font-size:.78rem;padding:0}
.each{font-size:.78rem;color:var(--soft);margin-top:6px;min-height:1.2em}
.primary{width:100%;margin-top:4px;background:var(--ink);color:var(--paper);border:0;border-radius:9px;padding:13px;font-weight:600}
.primary:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:.82rem;color:var(--warn);margin-top:8px}

h2.sec{font-size:.85rem;font-weight:500;color:var(--soft);margin:30px 0 8px}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
ul.items li.editing{display:block;padding:14px 12px;background:var(--sunk);border-radius:12px;border-bottom:0;margin:6px 0}
ul.items li .row2{display:flex;gap:8px;margin-bottom:8px}
ul.items li .row2 label{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
ul.items li .row2 label span.l{font-size:.75rem;color:var(--soft)}
.editacts{display:flex;gap:8px;margin-top:4px}
.editacts button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--soft)}
.editacts button.save{background:var(--ink);color:var(--paper);border:0;font-weight:600}
.editacts button.rm{color:var(--warn);border-color:var(--warn)}
.tapme{flex:1;min-width:0;display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.dot{width:9px;height:9px;border-radius:99px;flex:none;background:var(--pc)}
.desc{flex:1;min-width:0}
.desc b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc small{color:var(--soft);font-size:.78rem}
.amt2{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.empty{color:var(--soft);font-size:.92rem;padding:14px 2px}

.settle{margin-top:26px}
.ghost{width:100%;background:none;border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--soft)}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.confirm{background:var(--sunk);border-radius:12px;padding:16px;margin-top:10px}
.confirm p{margin:0 0 12px;font-size:.95rem}
.confirm ul.pay{margin-bottom:14px}
.confirm .row{display:flex;gap:8px}
.confirm .row button{flex:1}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}

ul.hist{list-style:none;margin:0;padding:0}
ul.hist li{padding:0;border-bottom:1px solid var(--line)}
ul.hist .head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.9rem;
  background:none;border:0;padding:12px 2px;text-align:left;font-family:inherit;color:inherit}
ul.hist .head:hover .when{color:var(--ink)}
ul.hist .when{color:var(--soft)}
ul.hist .what{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.hist .body{padding:2px 2px 14px}
ul.hist .sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px 12px;font-size:.82rem;color:var(--soft);
  padding-bottom:8px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
ul.hist .tr{font-size:.85rem;padding:3px 0}
ul.hist .tr b{font-weight:600}
ul.hist .trs{padding-bottom:8px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
ul.hist .line{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:.85rem}
ul.hist .line .dot{width:7px;height:7px}
ul.hist .line .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.hist .line .dd{color:var(--soft);font-size:.78rem;white-space:nowrap}
ul.hist .line .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.reopen{margin-top:12px}
.reopen button{width:100%;background:none;border:1px solid var(--line);border-radius:9px;padding:10px;
  color:var(--soft);font-size:.86rem}
.reopen button:hover{color:var(--ink);border-color:var(--ink)}
.reopen p{margin:0 0 10px;font-size:.84rem;color:var(--soft)}
.reopen .pair{display:flex;gap:8px}
.reopen .pair button{flex:1}
.reopen .pair button.go{background:var(--ink);color:var(--paper);border:0;font-weight:600}

.notice{font-size:.82rem;color:var(--soft);margin-top:26px;text-align:center}
.panel{background:var(--sunk);border-radius:12px;padding:16px;margin-bottom:22px}
.panel .names{margin-bottom:0}

#waking{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
  background:#0d1512 var(--photo) center 38%/contain no-repeat;}
@media (min-aspect-ratio:4/5){#waking{background-size:cover;background-position:center 30%}}
#waking[hidden]{display:none}
.wk-shade{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,18,15,0) 34%,rgba(10,18,15,.55) 62%,rgba(10,18,15,.93) 100%)}
.wk-text{position:relative;width:100%;max-width:540px;margin:0 auto;
  padding:0 26px calc(46px + env(safe-area-inset-bottom,0px));color:#F2F5F1;text-align:left}
.wk-text h1{font-family:'Fraunces',Georgia,serif;font-size:1.7rem;font-weight:600;
  letter-spacing:-.01em;margin:0 0 6px;color:#fff}
.wk-text p{margin:0 0 16px;font-size:.95rem;color:rgba(242,245,241,.82);min-height:1.4em}
.wk-bar{height:3px;border-radius:99px;background:rgba(242,245,241,.22);overflow:hidden}
.wk-bar i{display:block;height:100%;width:38%;border-radius:99px;background:#7FD8BC;
  animation:wkslide 1.7s ease-in-out infinite}
@keyframes wkslide{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(264%)}
}
@media (prefers-reduced-motion:reduce){
  .wk-bar i{animation:none;width:100%;opacity:.5}
}
#gate{max-width:340px;margin:16vh auto 0;padding:0 20px;text-align:center}
#gate h1{font-family:'Fraunces',Georgia,serif;font-size:1.6rem;margin-bottom:6px}
#gate p{color:var(--soft);font-size:.9rem;margin:0 0 18px}
#gate input{text-align:center;letter-spacing:.3em;font-size:1.2rem;margin-bottom:10px}
</style>
</head>
<body>

<div id="waking" hidden>
  <div class="wk-shade"></div>
  <div class="wk-text">
    <h1>Utleggsoversikt</h1>
    <p id="wkMsg">Vekker serveren …</p>
    <div class="wk-bar"><i></i></div>
  </div>
</div>

<div id="gate" hidden>
  <h1>Utleggsoversikt</h1>
  <p>Tast inn koden dere deler.</p>
  <input type="password" id="pinInput" inputmode="numeric" autocomplete="current-password" placeholder="••••">
  <button class="primary" id="pinGo">Åpne</button>
  <div class="hint" id="pinHint"></div>
</div>

<div class="wrap" id="app" hidden>

  <div class="top">
    <h1 class="mark">Utleggsoversikt</h1>
    <button class="linkbtn" id="toggleNames">Rediger navn</button>
  </div>

  <div class="panel" id="namePanel" hidden>
    <div class="names" id="nameFields"></div>
    <button class="ghost" id="namesDone" style="margin-top:12px">Ferdig</button>
  </div>

  <div class="banner" role="img" aria-label="Bilde av jentene"></div>

  <div class="hero">
    <div class="period" id="periodLabel">Laster …</div>
    <h2 class="verdict" id="verdict">&nbsp;</h2>
    <ul class="pay" id="payList" hidden></ul>
    <div class="split" id="split"></div>
    <div class="legend" id="legend"></div>
    <div class="totline" id="totLine"></div>
  </div>

  <div class="card">
    <div class="form-row">
      <label class="f" style="flex:1.3"><span class="l">Beløp</span><input type="text" id="fAmount" class="big" inputmode="decimal" placeholder="0" autocomplete="off"></label>
      <label class="f"><span class="l">Dato</span><input type="date" id="fDate"></label>
    </div>
    <div class="form-row">
      <label class="f"><span class="l">Hva gjaldt det?</span><input type="text" id="fDesc" maxlength="60" placeholder="Middag" autocomplete="off"></label>
    </div>
    <div class="form-row">
      <div class="f" style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:0">
        <span class="l" style="font-size:.8rem;color:var(--soft)">Hvem la ut?</span>
        <div class="payer" id="payers"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="f" style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:0">
        <span class="lbl"><span class="l" style="font-size:.8rem;color:var(--soft)">Hvem er med?</span><button type="button" class="linkbtn" id="sharesAll">Alle</button></span>
        <div class="payer shares" id="sharers"></div>
        <div class="each" id="each"></div>
      </div>
    </div>
    <button class="primary" id="add">Legg til utlegg</button>
    <div class="hint" id="hint"></div>
  </div>

  <h2 class="sec" id="listHead">Utlegg i perioden</h2>
  <ul class="items" id="list"></ul>
  <div class="empty" id="listEmpty">Ingen utlegg registrert ennå.</div>

  <div class="settle">
    <button class="ghost" id="settleBtn">Gjør opp og start ny periode</button>
    <div class="confirm" id="settleBox" hidden>
      <p id="settleText"></p>
      <ul class="pay" id="settleList"></ul>
      <p style="font-size:.8rem;color:var(--soft);margin-bottom:8px">Navn i ny periode</p>
      <div class="names" id="settleNames"></div>
      <div class="row">
        <button class="ghost" id="settleCancel">Avbryt</button>
        <button class="primary" id="settleOk" style="margin-top:0">Bekreft oppgjør</button>
      </div>
    </div>
  </div>

  <div id="histWrap" hidden>
    <h2 class="sec">Tidligere oppgjør</h2>
    <ul class="hist" id="hist"></ul>
  </div>

  <div class="notice" id="notice" hidden></div>
</div>

<script>
(function(){
  "use strict";

  var DEFAULT_NAMES = ["Lisell","Annika","Lina","Johanna","Elin"];
  var N = DEFAULT_NAMES.length;

  var cfg = { names: DEFAULT_NAMES.slice(), currentPeriodId:null };
  var ALL = DEFAULT_NAMES.map(function(_, i){ return i; });
  var expenses = [], periods = [], payer = 0, shares = ALL.slice(), pin = "";
  var editingId = null, openPeriod = null, archive = {}, confirmReopen = null;
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }

  /* ---------- formatering ---------- */
  var nf0 = new Intl.NumberFormat("nb-NO", {maximumFractionDigits:0});
  var nf2 = new Intl.NumberFormat("nb-NO", {minimumFractionDigits:2, maximumFractionDigits:2});
  function kr(n){
    n = Math.round(n*100)/100;
    return (Math.abs(n % 1) < 0.005 ? nf0.format(n) : nf2.format(n)) + " kr";
  }
  function parseAmount(raw){
    if(raw == null) return NaN;
    var s = String(raw).trim().replace(/[^\d.,-]/g, "");
    if(!s) return NaN;
    var hasComma = s.indexOf(",") > -1, hasDot = s.indexOf(".") > -1;
    if(hasComma && hasDot){ s = s.replace(/\./g,"").replace(",", "."); }
    else if(hasComma){ s = s.replace(/,/g,"."); }
    else if(hasDot){
      var p = s.split(".");
      if(p.length > 2 || p[p.length-1].length === 3) s = p.join("");
    }
    var n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }
  var MONTHS = ["jan.","feb.","mars","apr.","mai","juni","juli","aug.","sep.","okt.","nov.","des."];
  function shortDate(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d)) return "";
    return d.getDate() + ". " + MONTHS[d.getMonth()];
  }
  function today(){
    var d = new Date(), m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
  }
  function nm(i, names){ var n = names || cfg.names; return (n && n[i]) || DEFAULT_NAMES[i] || "?"; }
  function pidx(v){ v = parseInt(v,10); return (v >= 0 && v < N) ? v : 0; }
  function sh(e){
    var s = Array.isArray(e.shares) ? e.shares.filter(function(i){ return i >= 0 && i < N; }) : [];
    return s.length ? s : ALL.slice();
  }
  function forText(e, names){
    var s = sh(e);
    if(s.length === N) return "";
    return " · for " + s.map(function(i){ return nm(i, names); }).join(", ");
  }
  function toggleIn(list, i){
    var k = list.indexOf(i);
    if(k > -1){ if(list.length > 1) list.splice(k, 1); }
    else { list.push(i); list.sort(); }
  }
  /* Rad med av/på-knapper for hvem som er med på et utlegg. */
  function shareButtons(box, list, onChange){
    box.textContent = "";
    for(var i=0;i<N;i++){
      (function(i){
        var b = el("button", "c" + i, nm(i));
        b.type = "button";
        b.setAttribute("aria-pressed", list.indexOf(i) > -1 ? "true" : "false");
        b.addEventListener("click", function(){
          toggleIn(list, i);
          shareButtons(box, list, onChange);
          if(onChange) onChange();
        });
        box.appendChild(b);
      })(i);
    }
  }

  /* ---------- API ---------- */
  function api(method, url, body){
    return fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json", "x-pin": pin },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      if(r.status === 401){ lock(); throw new Error("pin"); }
      if(!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }
  function apply(state){
    cfg = state.config;
    expenses = state.expenses;
    periods = state.periods;
    render();
  }
  function refresh(){
    if(editingId !== null) return Promise.resolve();
    if(document.activeElement && document.activeElement.closest &&
       document.activeElement.closest("#namePanel, #settleBox")) return Promise.resolve();
    return api("GET", "/api/state").then(apply).catch(function(){});
  }

  /* ---------- kodelås ---------- */
  function lock(){
    try { localStorage.removeItem("g5_pin"); } catch(e){}
    pin = "";
    $("app").hidden = true;
    $("gate").hidden = false;
    $("pinHint").textContent = "Feil kode.";
  }
  /* ---------- ventesiden mens serveren våkner ---------- */
  var wakeTimer = null, wakeTick = null, wakeStart = 0;

  function showWaking(){
    if($("waking").hidden === false) return;
    $("waking").hidden = false;
    wakeStart = Date.now();
    $("wkMsg").textContent = "Vekker serveren …";
    wakeTick = setInterval(function(){
      var s = Math.round((Date.now() - wakeStart)/1000);
      if(s > 12){
        $("wkMsg").textContent = "Serveren sov. Første oppstart tar rundt ett minutt.";
      }
    }, 1000);
  }
  function hideWaking(){
    if(wakeTimer){ clearTimeout(wakeTimer); wakeTimer = null; }
    if(wakeTick){ clearInterval(wakeTick); wakeTick = null; }
    $("waking").hidden = true;
  }

  function boot(candidate){
    pin = candidate;
    if(!wakeTimer && $("waking").hidden) wakeTimer = setTimeout(showWaking, 1200);

    return api("GET", "/api/state").then(function(state){
      hideWaking();
      try { localStorage.setItem("g5_pin", pin); } catch(e){}
      $("gate").hidden = true;
      $("app").hidden = false;
      apply(state);
      startPolling();
    }).catch(function(err){
      if(err && err.message === "pin"){ hideWaking(); throw err; }
      showWaking();
      return new Promise(function(done){ setTimeout(done, 3000); })
        .then(function(){ return boot(candidate); });
    });
  }

  function unlock(candidate){
    pin = candidate;
    return api("GET", "/api/state").then(function(state){
      try { localStorage.setItem("g5_pin", pin); } catch(e){}
      $("gate").hidden = true;
      $("app").hidden = false;
      apply(state);
      startPolling();
    });
  }

  /* ---------- utregning ----------
     Hvert utlegg deles likt på dem som er huket av. Oppgjøret finner
     færrest mulig betalinger som gjør alle kvitt (samme regel som på serveren).
     Alt regnes i 1/60 øre slik at deling på 1–5 blir eksakt. */
  var UNIT = 60;
  function totals(){
    var t = [];
    for(var i=0;i<N;i++) t.push(0);
    for(var j=0;j<expenses.length;j++) t[pidx(expenses[j].payer)] += expenses[j].amount;
    return t;
  }
  function balances(list){
    var bal = [];
    for(var i=0;i<N;i++) bal.push(0);
    list.forEach(function(e){
      var ore = Math.round(e.amount*100), s = sh(e), part = ore*UNIT/s.length;
      bal[pidx(e.payer)] += ore*UNIT;
      s.forEach(function(i){ bal[i] -= part; });
    });
    return bal;
  }
  function settlement(list){
    var bal = balances(list), cred = [], debt = [];
    bal.forEach(function(b, i){
      if(b > 0) cred.push({i:i, v:b}); else if(b < 0) debt.push({i:i, v:-b});
    });
    cred.sort(function(x,y){ return y.v - x.v; });
    debt.sort(function(x,y){ return y.v - x.v; });
    var out = [], ci = 0, di = 0;
    while(ci < cred.length && di < debt.length){
      var m = Math.min(cred[ci].v, debt[di].v);
      var ore = Math.round(m / UNIT);
      if(ore >= 1) out.push({from: debt[di].i, to: cred[ci].i, amount: ore/100});
      cred[ci].v -= m; debt[di].v -= m;
      if(cred[ci].v === 0) ci++;
      if(debt[di].v === 0) di++;
    }
    return out;
  }
  function payRow(tr, names){
    var li = el("li");
    var w = el("span", "who2");
    var a = el("b", "c" + tr.from, nm(tr.from, names));
    var b = el("b", "c" + tr.to, nm(tr.to, names));
    w.appendChild(a); w.appendChild(document.createTextNode(" betaler ")); w.appendChild(b);
    li.appendChild(w);
    li.appendChild(el("span", "v", kr(tr.amount)));
    return li;
  }

  /* ---------- visning ---------- */
  function nameInputs(container, prefix){
    if(container.childElementCount === N) return;
    container.textContent = "";
    for(var i=0;i<N;i++){
      var l = el("label", "f");
      l.appendChild(el("span", "l", "Person " + (i+1)));
      var inp = el("input");
      inp.type = "text"; inp.maxLength = 18; inp.id = prefix + i;
      l.appendChild(inp);
      container.appendChild(l);
    }
  }
  function renderNames(){
    var box = $("payers");
    if(box.childElementCount !== N){
      box.textContent = "";
      for(var i=0;i<N;i++){
        (function(i){
          var b = el("button", "c" + i);
          b.type = "button"; b.id = "pay" + i;
          b.addEventListener("click", function(){ payer = i; renderNames(); });
          box.appendChild(b);
        })(i);
      }
    }
    for(var k=0;k<N;k++){
      var btn = $("pay" + k);
      btn.textContent = nm(k);
      btn.setAttribute("aria-pressed", payer === k ? "true" : "false");
      var inp = $("name" + k);
      if(inp && document.activeElement !== inp) inp.value = nm(k);
    }
    shareButtons($("sharers"), shares, renderEach);
    renderEach();
  }
  function renderEach(){
    var amount = parseAmount($("fAmount").value);
    var who = shares.length === N ? "alle fem" : shares.length === 1 ? "én person" : shares.length + " personer";
    $("each").textContent = isFinite(amount) && amount > 0
      ? "Deles på " + who + ": " + kr(amount / shares.length) + " hver"
      : "Deles på " + who;
  }
  function renderHero(){
    var t = totals(), sum = t.reduce(function(a,b){ return a+b; }, 0);
    var bal = balances(expenses);
    var tr = settlement(expenses);

    var split = $("split");
    split.textContent = "";
    for(var i=0;i<N;i++){
      var seg = el("i", "c" + i);
      seg.style.width = (sum > 0 ? (t[i]/sum*100) : (100/N)) + "%";
      split.appendChild(seg);
    }

    var lg = $("legend");
    lg.textContent = "";
    lg.appendChild(el("span", "head", ""));
    lg.appendChild(el("span", "head amt", "la ut"));
    lg.appendChild(el("span", "head bal", "saldo"));
    for(var j=0;j<N;j++){
      (function(j){
        var who = el("button", "who c" + j);
        who.type = "button";
        who.appendChild(el("i", "dot"));
        who.appendChild(el("span", null, nm(j)));
        who.addEventListener("click", function(){ openNames(j); });
        lg.appendChild(who);
        lg.appendChild(el("span", "amt", kr(t[j])));
        var d = Math.round(bal[j] / UNIT) / 100;
        var cls = Math.abs(d) < 0.005 ? "zero" : (d > 0 ? "plus" : "minus");
        lg.appendChild(el("span", "bal " + cls,
          Math.abs(d) < 0.005 ? "±0" : (d > 0 ? "+" : "−") + kr(Math.abs(d))));
      })(j);
    }
    $("totLine").textContent = sum > 0 ? "Totalt " + kr(sum) + " lagt ut i perioden" : "";

    var v = $("verdict"), pl = $("payList");
    pl.textContent = "";
    pl.hidden = true;
    v.className = "verdict";
    if(sum === 0){ v.textContent = "Ingenting lagt ut ennå."; }
    else if(tr.length === 0){ v.textContent = "Dere er helt kvitt."; }
    else if(tr.length === 1){
      v.textContent = "";
      v.appendChild(document.createTextNode(nm(tr[0].from) + " skylder " + nm(tr[0].to) + " "));
      var s = el("span", "sum", kr(tr[0].amount));
      v.appendChild(s);
    } else {
      v.className = "verdict many";
      v.textContent = tr.length + " betalinger gjør dere kvitt";
      tr.forEach(function(x){ pl.appendChild(payRow(x)); });
      pl.hidden = false;
    }

    var cur = null;
    for(var k=0;k<periods.length;k++) if(periods[k].id === cfg.currentPeriodId) cur = periods[k];
    $("periodLabel").textContent = cur && cur.startedAt
      ? "Perioden startet " + shortDate(cur.startedAt)
      : "Pågående periode";
  }
  function editRow(e){
    var li = el("li", "editing");

    function field(labelText, id, value, type){
      var l = el("label");
      l.appendChild(el("span", "l", labelText));
      var inp = el("input");
      inp.type = type || "text";
      inp.id = id;
      inp.value = value;
      if(id === "eAmount") inp.inputMode = "decimal";
      if(id === "eDesc") inp.maxLength = 60;
      l.appendChild(inp);
      return l;
    }

    var r1 = el("div", "row2");
    r1.appendChild(field("Beløp", "eAmount", String(e.amount).replace(".", ","), "text"));
    r1.appendChild(field("Dato", "eDate", e.date, "date"));
    li.appendChild(r1);

    var r2 = el("div", "row2");
    r2.appendChild(field("Hva gjaldt det?", "eDesc", e.desc || "", "text"));
    li.appendChild(r2);

    var r3 = el("div", "row2");
    var pl = el("label");
    pl.appendChild(el("span", "l", "Hvem la ut?"));
    var pw = el("span", "payer");
    var chosen = pidx(e.payer), btns = [];
    function mark(){
      btns.forEach(function(b, i){ b.setAttribute("aria-pressed", chosen === i ? "true" : "false"); });
    }
    for(var i=0;i<N;i++){
      (function(i){
        var b = el("button", "c" + i, nm(i));
        b.type = "button";
        b.addEventListener("click", function(){ chosen = i; mark(); });
        btns.push(b);
        pw.appendChild(b);
      })(i);
    }
    mark();
    pl.appendChild(pw);
    r3.appendChild(pl);
    li.appendChild(r3);

    var eShares = sh(e).slice();
    var r4 = el("div", "row2");
    var sl = el("label");
    sl.appendChild(el("span", "l", "Hvem er med?"));
    var sw = el("span", "payer shares");
    shareButtons(sw, eShares);
    sl.appendChild(sw);
    r4.appendChild(sl);
    li.appendChild(r4);

    var acts = el("div", "editacts");

    var cancel = el("button", null, "Avbryt");
    cancel.type = "button";
    cancel.addEventListener("click", function(){ editingId = null; render(); });

    var rm = el("button", "rm", "Slett");
    rm.type = "button";
    rm.addEventListener("click", function(){
      editingId = null;
      api("DELETE", "/api/expenses/" + e.id).then(apply)
        .catch(function(){ say("Klarte ikke å slette."); });
    });

    var save = el("button", "save", "Lagre");
    save.type = "button";
    save.addEventListener("click", function(){
      var amount = parseAmount(document.getElementById("eAmount").value);
      if(!isFinite(amount) || amount <= 0){ say("Skriv inn et beløp."); return; }
      say("");
      save.disabled = true;
      api("PUT", "/api/expenses/" + e.id, {
        amount: Math.round(amount*100)/100,
        date: document.getElementById("eDate").value || e.date,
        desc: (document.getElementById("eDesc").value || "").trim(),
        payer: chosen,
        shares: eShares
      }).then(function(state){
        editingId = null;
        apply(state);
      }).catch(function(){
        save.disabled = false;
        say("Klarte ikke å lagre endringen.");
      });
    });

    acts.appendChild(cancel); acts.appendChild(rm); acts.appendChild(save);
    li.appendChild(acts);
    return li;
  }

  function renderList(){
    var ul = $("list");
    ul.textContent = "";
    $("listEmpty").hidden = expenses.length > 0;
    $("listHead").textContent = expenses.length
      ? "Utlegg i perioden (" + expenses.length + ")"
      : "Utlegg i perioden";

    expenses.forEach(function(e){
      if(e.id === editingId){ ul.appendChild(editRow(e)); return; }

      var li = el("li");
      var tap = el("button", "tapme c" + pidx(e.payer));
      tap.type = "button";
      tap.setAttribute("aria-label", "Rediger " + (e.desc || "utlegg"));

      tap.appendChild(el("span", "dot"));

      var d = el("span", "desc");
      d.appendChild(el("b", null, e.desc || "Utlegg"));
      d.appendChild(el("small", null, shortDate(e.date) + " · " + nm(pidx(e.payer)) + " la ut" + forText(e)));
      tap.appendChild(d);

      tap.appendChild(el("span", "amt2", kr(e.amount)));

      tap.addEventListener("click", function(){
        editingId = e.id;
        say("");
        render();
      });

      li.appendChild(tap);
      ul.appendChild(li);
    });
  }
  function renderHistory(){
    var done = periods.filter(function(p){ return p.settledAt; });
    $("histWrap").hidden = done.length === 0;
    var ul = $("hist");
    ul.textContent = "";

    done.forEach(function(p){
      var li = el("li");
      var names = p.names || cfg.names;
      var trs = p.transfers || [];
      var tot = (p.totals || []).reduce(function(a,b){ return a+b; }, 0);

      var head = el("button", "head");
      head.type = "button";
      head.setAttribute("aria-expanded", openPeriod === p.id ? "true" : "false");

      head.appendChild(el("span", "when", shortDate(p.startedAt) + " – " + shortDate(p.settledAt)));
      head.appendChild(el("span", "what",
        trs.length === 0 ? "kvitt"
          : trs.length === 1
            ? nm(trs[0].from, names) + " → " + nm(trs[0].to, names) + " " + kr(trs[0].amount)
            : trs.length + " betalinger · " + kr(tot)));

      head.addEventListener("click", function(){
        if(openPeriod === p.id){ openPeriod = null; render(); return; }
        openPeriod = p.id;
        render();
        if(!archive[p.id]){
          api("GET", "/api/periods/" + p.id + "/expenses").then(function(r){
            archive[p.id] = r.expenses;
            render();
          }).catch(function(){
            archive[p.id] = [];
            render();
          });
        }
      });
      li.appendChild(head);

      if(openPeriod === p.id){
        var body = el("div", "body");

        var sums = el("div", "sums");
        for(var i=0;i<N;i++){
          sums.appendChild(el("span", null, nm(i, names) + " la ut " + kr((p.totals || [])[i] || 0)));
        }
        body.appendChild(sums);

        if(trs.length){
          var tw = el("div", "trs");
          trs.forEach(function(x){
            var row = el("div", "tr");
            row.appendChild(el("b", null, nm(x.from, names)));
            row.appendChild(document.createTextNode(" betalte "));
            row.appendChild(el("b", null, nm(x.to, names)));
            row.appendChild(document.createTextNode(" " + kr(x.amount)));
            tw.appendChild(row);
          });
          body.appendChild(tw);
        }

        var rows = archive[p.id];
        if(!rows){
          body.appendChild(el("div", "line", "Henter utlegg …"));
        } else if(rows.length === 0){
          body.appendChild(el("div", "line", "Ingen utlegg i denne perioden."));
        } else {
          rows.forEach(function(e){
            var line = el("div", "line c" + pidx(e.payer));
            line.appendChild(el("span", "dot"));
            line.appendChild(el("span", "dd", shortDate(e.date)));
            line.appendChild(el("span", "d", (e.desc || "Utlegg") + " · " + nm(pidx(e.payer), names) + forText(e, names)));
            line.appendChild(el("span", "v", kr(e.amount)));
            body.appendChild(line);
          });
        }
        var ro = el("div", "reopen");

        if(confirmReopen === p.id){
          var extra = expenses.length;
          ro.appendChild(el("p", null, extra > 0
            ? "Perioden åpnes igjen, og de " + extra + " utleggene i den pågående perioden flyttes inn i den."
            : "Perioden åpnes igjen og blir den pågående perioden."));

          var pair = el("div", "pair");

          var no = el("button", null, "Avbryt");
          no.type = "button";
          no.addEventListener("click", function(){ confirmReopen = null; render(); });

          var yes = el("button", "go", "Gjenåpne");
          yes.type = "button";
          yes.addEventListener("click", function(){
            yes.disabled = true;
            api("POST", "/api/periods/" + p.id + "/reopen").then(function(state){
              confirmReopen = null;
              openPeriod = null;
              archive = {};
              apply(state);
            }).catch(function(){
              yes.disabled = false;
              say("Klarte ikke å gjenåpne perioden.");
            });
          });

          pair.appendChild(no); pair.appendChild(yes);
          ro.appendChild(pair);
        } else {
          var open = el("button", null, "Gjenåpne og fortsett perioden");
          open.type = "button";
          open.addEventListener("click", function(){
            confirmReopen = p.id;
            say("");
            render();
          });
          ro.appendChild(open);
        }
        body.appendChild(ro);

        li.appendChild(body);
      }

      ul.appendChild(li);
    });
  }
  function render(){ renderNames(); renderHero(); renderList(); renderHistory(); }
  function say(msg){ $("hint").textContent = msg || ""; }

  /* ---------- handlinger ---------- */
  function addExpense(){
    var amount = parseAmount($("fAmount").value);
    if(!isFinite(amount) || amount <= 0){ say("Skriv inn et beløp."); $("fAmount").focus(); return; }
    var body = {
      amount: Math.round(amount*100)/100,
      date: $("fDate").value || today(),
      desc: ($("fDesc").value || "").trim(),
      payer: payer,
      shares: shares.slice()
    };
    say("");
    $("add").disabled = true;
    api("POST", "/api/expenses", body).then(function(state){
      $("fAmount").value = ""; $("fDesc").value = "";
      shares = ALL.slice();
      apply(state);
      $("fAmount").focus();
    }).catch(function(){ say("Klarte ikke å lagre. Prøv igjen."); })
      .then(function(){ $("add").disabled = false; });
  }
  function readNames(prefix){
    var out = [];
    for(var i=0;i<N;i++){
      var inp = $(prefix + i);
      out.push(((inp && inp.value) || "").trim() || nm(i));
    }
    return out;
  }
  function saveNames(){
    cfg.names = readNames("name");
    render();
    api("POST", "/api/names", {names: cfg.names}).then(apply).catch(function(){});
  }
  function settle(){
    $("settleOk").disabled = true;
    api("POST", "/api/settle", { names: readNames("sName") }).then(function(state){
      $("settleBox").hidden = true;
      archive = {};
      apply(state);
    }).catch(function(){ say("Klarte ikke å gjøre opp. Prøv igjen."); })
      .then(function(){ $("settleOk").disabled = false; });
  }

  /* ---------- polling ---------- */
  var timer = null;
  function startPolling(){
    if(timer) return;
    timer = setInterval(function(){
      if(document.visibilityState === "visible") refresh();
    }, 8000);
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible") refresh();
    });
  }

  /* ---------- kobling ---------- */
  $("fDate").value = today();
  nameInputs($("nameFields"), "name");
  nameInputs($("settleNames"), "sName");

  $("add").addEventListener("click", addExpense);
  $("fAmount").addEventListener("input", renderEach);
  $("sharesAll").addEventListener("click", function(){
    shares = ALL.slice();
    shareButtons($("sharers"), shares, renderEach);
    renderEach();
  });
  $("fAmount").addEventListener("keydown", function(e){ if(e.key === "Enter") $("fDesc").focus(); });
  $("fDesc").addEventListener("keydown", function(e){ if(e.key === "Enter") addExpense(); });

  function openNames(i){
    $("namePanel").hidden = false;
    $("name" + (i || 0)).focus();
  }
  $("toggleNames").addEventListener("click", function(){
    var p = $("namePanel");
    p.hidden = !p.hidden;
    if(!p.hidden) $("name0").focus();
  });
  $("namesDone").addEventListener("click", function(){ saveNames(); $("namePanel").hidden = true; });
  for(var ni=0; ni<N; ni++){
    $("name" + ni).addEventListener("change", saveNames);
  }

  $("settleBtn").addEventListener("click", function(){
    if(expenses.length === 0){ say("Ingen utlegg å gjøre opp."); return; }
    say("");
    var tr = settlement(expenses);
    var sl = $("settleList");
    sl.textContent = "";
    if(tr.length === 0){
      $("settleText").textContent = "Dere er kvitt for denne perioden. Utleggene arkiveres og en ny periode starter nå.";
    } else {
      $("settleText").textContent = "Slik gjør dere opp. Utleggene arkiveres og en ny periode starter nå.";
      tr.forEach(function(x){ sl.appendChild(payRow(x)); });
    }
    for(var i=0;i<N;i++) $("sName" + i).value = nm(i);
    $("settleBox").hidden = false;
  });
  $("settleCancel").addEventListener("click", function(){ $("settleBox").hidden = true; });
  $("settleOk").addEventListener("click", settle);

  $("pinGo").addEventListener("click", function(){
    $("pinHint").textContent = "";
    unlock(($("pinInput").value || "").trim()).catch(function(){
      $("pinHint").textContent = "Feil kode.";
    });
  });
  $("pinInput").addEventListener("keydown", function(e){ if(e.key === "Enter") $("pinGo").click(); });

  /* ---------- oppstart ---------- */
  var saved = "";
  try { saved = localStorage.getItem("g5_pin") || ""; } catch(e){}
  boot(saved).catch(function(){
    $("gate").hidden = false;
    $("pinHint").textContent = "";
    $("pinInput").focus();
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
