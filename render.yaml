services:
  - type: web
    name: utleggsoversikt-jentene
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PIN
        sync: false
      - key: PGSSL
        value: "on"
